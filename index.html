<style>
/* =====================================================================
   FoodLoopBKK prototype — styles
   Sections: tokens · base · stage & phone frame · shared components ·
             onboarding · home · fridge · deals · dispose · rewards ·
             overlays · guide · feedback (toasts, confetti) · responsive
   ===================================================================== */

/* ---------- Tokens (greens from BMA_CI.md, one warm accent) ---------- */
:root {
  --green-900: #2A6419;   /* BMA Deep Green: primary actions, headings */
  --green-700: #39682C;   /* BMA Forest Green: caption bars */
  --green-500: #4BA254;   /* BMA Mid Green: fills and large text only */
  --green-300: #B9E08A;   /* light leaf: ring fill on dark green */
  --green-100: #E4F1D9;
  --green-50:  #F3F8EC;   /* page */
  --bma-grey:  #F1F1F1;   /* BMA Page Grey, used on the Dispose screens */

  --ink:   #14230E;
  --ink-2: #3F4F37;
  --ink-3: #5F6C58;       /* meta text, 5.4:1 on white */
  --line:  #DCE6D1;
  --surface: #FFFFFF;

  --amber-500: #F6A609;   /* the one warm accent: rewards and urgency */
  --amber-100: #FFEFC9;
  --amber-900: #6F4300;
  --hot-100:  #FFE1D2;    /* "expires today", a hotter step of the same accent */
  --hot-900:  #93300A;
  --danger:   #B3261E;

  --font-display: "Mitr", "Anuphan", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --font-body: "Anuphan", "Noto Sans Thai", "Sarabun", "Leelawadee UI", "Thonburi", system-ui, -apple-system, "Segoe UI", sans-serif;

  --r-card: 22px;
  --r-btn: 16px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

/* ---------- Base ---------- */
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;               /* Thai tone marks need >= 1.5 */
  color: var(--ink);
  background: #E6EEDB;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
ul, ol { list-style: none; padding: 0; }
img, svg { display: block; max-width: 100%; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; line-height: 1.35; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 8px; }
.on-dark :focus-visible, .on-dark:focus-visible { outline-color: #fff; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.ic { flex: none; }
.th { font-family: var(--font-body); }

/* ---------- Stage (desktop) and phone frame ---------- */
.stage {
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center; gap: 56px;
  padding: 16px; position: relative; overflow: hidden;
}
.stage::before {                    /* a faint loop behind the phone */
  content: ""; position: absolute; width: 980px; height: 980px; border-radius: 50%;
  border: 96px solid rgba(75, 162, 84, .13); left: -340px; bottom: -520px; pointer-events: none;
}
.presenter { display: none; width: 340px; position: relative; }
.presenter h1 { font-size: 40px; font-weight: 600; color: var(--green-900); line-height: 1.2; display: flex; align-items: center; gap: 12px; }
.presenter .lede { font-size: 19px; color: var(--ink-2); margin: 12px 0 28px; }
.journey li { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-top: 1px solid rgba(42, 100, 25, .18); }
.journey li b { display: block; font-family: var(--font-display); font-weight: 500; color: var(--green-900); }
.journey li span { color: var(--ink-2); font-size: 15px; }
.journey .tile { width: 40px; height: 40px; border-radius: 12px; background: var(--green-900); color: #fff; display: grid; place-items: center; flex: none; }
.presenter .controls { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
.presenter .note { font-size: 13px; color: var(--ink-3); margin-top: 20px; }
kbd { font-family: inherit; font-size: 13px; background: #fff; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; }

.phone {
  width: 410px; flex: none;        /* 390 px app + 10 px bezel each side */
  height: min(864px, calc(100vh - 32px)); height: min(864px, calc(100dvh - 32px));
  background: var(--ink); border-radius: 46px; padding: 10px; position: relative;
  box-shadow: 0 30px 70px -20px rgba(20, 35, 14, .45), 0 0 0 1px rgba(20, 35, 14, .2);
}
.app {
  height: 100%; border-radius: 37px; overflow: hidden; position: relative;
  background: var(--green-50); display: flex; flex-direction: column;
}
.screen { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; outline: none; }
.screen::-webkit-scrollbar { display: none; }
.view { padding: 0 16px 20px; display: flex; flex-direction: column; gap: 16px; }

/* ---------- Shared components ---------- */
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 18px 0 2px; }
.topbar h1 { font-size: 26px; color: var(--ink); }
.topbar h1 .th { font-size: 17px; font-weight: 500; color: var(--ink-3); margin-left: 4px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--green-900); }
.topbar-actions { display: flex; align-items: center; gap: 6px; flex: none; }
.pts-pill {
  min-height: 44px; padding: 0 12px; border-radius: 999px; background: var(--amber-100); color: var(--amber-900);
  display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 15px; border: 1.5px solid #F3D48A;
}
.pts-pill.bump { animation: bump .5s var(--ease); }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); background: #fff; border: 1px solid var(--line); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.section-head h2 { font-size: 19px; }
.link { color: var(--green-900); font-weight: 600; font-size: 15px; min-height: 44px; display: inline-flex; align-items: center; gap: 2px; }
.meta { font-size: 14px; color: var(--ink-3); }

.btn {
  min-height: 50px; padding: 0 20px; border-radius: var(--r-btn); font-weight: 600; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  transition: transform .15s var(--ease), background-color .2s, opacity .2s; user-select: none;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--green-900); color: #fff; }
.btn-primary:hover { background: #235414; }
.btn-secondary { background: #fff; color: var(--green-900); box-shadow: inset 0 0 0 1.5px var(--green-900); }
.btn-ghost { color: var(--green-900); }
.btn-light { background: #fff; color: var(--green-900); }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; padding: 0 14px; font-size: 15px; border-radius: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
label.btn { cursor: pointer; }
label.btn:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }

.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  min-height: 44px; padding: 0 14px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line);
  font-weight: 500; font-size: 15px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; flex: none;
  transition: background-color .2s, color .2s, border-color .2s;
}
.chip[aria-pressed="true"] { background: var(--green-900); border-color: var(--green-900); color: #fff; }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--green-100); border-radius: 16px; padding: 4px; gap: 4px; }
.seg button { min-height: 44px; border-radius: 12px; font-weight: 600; font-size: 15px; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--green-900); box-shadow: 0 1px 3px rgba(20, 35, 14, .12); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill-fresh   { background: var(--green-100); color: var(--green-900); }
.pill-soon    { background: var(--amber-100); color: var(--amber-900); }
.pill-today   { background: var(--hot-100);  color: var(--hot-900); }
.pill-expired { background: #ECECEC; color: #4A4A4A; }
.pill-amber   { background: var(--amber-500); color: var(--ink); }
.pill-outline { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 500; }

.tile { width: 52px; height: 52px; border-radius: 16px; background: var(--green-50); display: grid; place-items: center; font-size: 28px; line-height: 1; flex: none; }
.proto-note { font-size: 13px; color: var(--ink-3); text-align: center; padding: 4px 8px 0; }
.empty { text-align: center; padding: 28px 16px; color: var(--ink-2); }
.empty b { display: block; font-family: var(--font-display); font-weight: 500; font-size: 18px; color: var(--ink); }

/* ---------- Tab bar ---------- */
.tabbar { display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 6px 4px calc(8px + env(safe-area-inset-bottom)); flex: none; }
.tabbar[hidden] { display: none; }
.tab { display: flex; flex-direction: column; align-items: center; min-height: 58px; color: var(--ink-3); border-radius: 14px; }
.tab .tab-ic { width: 52px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background-color .2s; }
.tab .en { font-size: 12px; font-weight: 600; line-height: 1.4; }
.tab .th { font-size: 11px; line-height: 1.5; }
.tab[aria-current="page"] { color: var(--green-900); }
.tab[aria-current="page"] .tab-ic { background: var(--green-100); }

/* ---------- Loop ring (the signature element) ---------- */
.ring circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.ring-track { stroke: rgba(255, 255, 255, .2); }
.ring-fill { stroke: var(--green-300); }
.ring-fill.is-fresh { animation: arcdraw .9s var(--ease) both; }
.ring.is-closed .ring-fill { stroke: var(--amber-500); }
.ring.on-light .ring-track { stroke: var(--green-100); }
.ring.on-light .ring-fill { stroke: var(--green-900); }

/* ---------- Onboarding ---------- */
.ob { min-height: 100%; background: var(--green-900); color: #fff; display: flex; flex-direction: column; padding: 14px 24px 24px; }
.ob-top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.ob-brand { font-family: var(--font-display); font-weight: 500; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.ob-skip { color: #fff; font-weight: 600; min-height: 44px; padding: 0 8px; }
.ob-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 8px 0 16px; animation: rise .45s var(--ease); }
.ob-art { position: relative; width: 210px; height: 210px; margin: 0 auto 4px; }
.ob-art .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ob-art .big { font-family: var(--font-display); font-weight: 600; font-size: 38px; line-height: 1.1; }
.ob-art .small { font-size: 14px; color: rgba(255, 255, 255, .88); }
.ob h1 { font-size: 30px; font-weight: 500; }
.ob p { color: rgba(255, 255, 255, .9); font-size: 16px; }
.ob-legend li { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; }
.ob-legend .sw { width: 14px; height: 14px; border-radius: 4px; margin-top: 6px; flex: none; }
.ob-legend b { font-family: var(--font-display); font-weight: 500; font-size: 18px; }
.ob-steps li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, .2); }
.ob-steps .tile { background: rgba(255, 255, 255, .14); color: #fff; width: 44px; height: 44px; border-radius: 14px; }
.ob-steps b { display: block; font-family: var(--font-display); font-weight: 500; }
.ob-steps span { font-size: 14px; color: rgba(255, 255, 255, .88); }
.ob-foot { display: flex; align-items: center; gap: 12px; }
.ob-foot .btn { white-space: nowrap; padding: 0 16px; }
.ob-dots { display: flex; gap: 6px; flex: 1; }
.ob-dots i { width: 8px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .35); transition: width .3s var(--ease), background-color .3s; }
.ob-dots i.on { width: 26px; background: #fff; }
.ob-note { font-size: 13px; color: rgba(255, 255, 255, .8); margin-top: 14px; }

/* ---------- Home ---------- */
.brand { font-family: var(--font-display); font-weight: 500; font-size: 15px; color: var(--green-900); display: flex; align-items: center; gap: 6px; }
.loop-card { background: var(--green-900); color: #fff; border: 0; padding: 18px 16px 14px; }
.loop-top { display: flex; gap: 14px; align-items: center; }
.ring-wrap { position: relative; width: 122px; height: 122px; flex: none; }
.ring-wrap .ring { width: 100%; height: 100%; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.ring-center b { font-family: var(--font-display); font-weight: 600; font-size: 34px; display: flex; align-items: center; gap: 2px; }
.ring-center .flame { color: var(--amber-500); }
.ring-center small { font-size: 13px; color: rgba(255, 255, 255, .9); }
.loop-copy { flex: 1; min-width: 0; }
.loop-copy h2 { font-size: 20px; margin-bottom: 4px; }
.loop-list button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; color: #fff; font-weight: 500; font-size: 15px; }
.loop-list .check { width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55); display: grid; place-items: center; flex: none; }
.loop-list .is-done .check { background: var(--green-300); box-shadow: none; color: var(--ink); }
.loop-list .is-done span { text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .6); }
.loop-list .go { margin-left: auto; opacity: .8; }
.loop-money { display: flex; align-items: baseline; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .2); }
.loop-money b { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.2; }
.loop-money span { font-size: 14px; color: rgba(255, 255, 255, .9); }

.mission { background: var(--amber-100); border-color: #F3D48A; display: grid; gap: 10px; }
.mission .eyebrow { color: var(--amber-900); display: flex; align-items: center; gap: 6px; }
.mission h2 { font-size: 19px; }
.mission.is-done { background: var(--green-100); border-color: #C9E2B4; }
.mission.is-done .eyebrow { color: var(--green-900); }

.soon-strip { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.soon-strip::-webkit-scrollbar { display: none; }
.soon-card { flex: none; width: 158px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 12px; display: grid; gap: 6px; align-content: start; }
.soon-card .emoji { font-size: 30px; line-height: 1.2; }
.soon-card b { font-weight: 600; line-height: 1.35; }
.soon-card .cook { font-size: 14px; font-weight: 600; color: var(--green-900); display: flex; align-items: center; gap: 4px; margin-top: 2px; }

/* ---------- Fridge ---------- */
.action-row { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; }
.group-label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin: 6px 4px -6px; }
.item { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; position: relative; overflow: hidden; }
.item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--green-500); }
.item.is-soon::before { background: var(--amber-500); }
.item.is-today::before { background: #E2571C; }
.item.is-expired::before { background: #9A9A9A; }
.item.is-expired .item-name { color: var(--ink-3); text-decoration: line-through; }
.item.is-new { animation: flash 1.4s var(--ease); }
.item-body { flex: 1; min-width: 0; display: grid; gap: 3px; justify-items: start; }
.item-name { font-weight: 600; line-height: 1.4; }
.item-name .th { font-weight: 400; color: var(--ink-3); font-size: 14px; }
.item-act { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--green-900); background: var(--green-50); flex: none; }
.item.is-expired .item-act { color: var(--ink-2); background: #F1F1F1; }

.recipe-card { display: flex; gap: 12px; width: 100%; padding: 14px; align-items: flex-start; transition: transform .15s var(--ease); }
.recipe-card:active { transform: scale(.985); }
.recipe-body { flex: 1; min-width: 0; display: grid; gap: 6px; justify-items: start; }
.recipe-title { display: flex; justify-content: space-between; gap: 8px; width: 100%; align-items: baseline; }
.recipe-title b { font-family: var(--font-display); font-weight: 500; font-size: 17px; line-height: 1.35; }
.ing-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ing { font-size: 13px; font-weight: 500; padding: 1px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }
.ing-have { background: var(--green-100); color: var(--green-900); }
.ing-miss { color: var(--ink-3); box-shadow: inset 0 0 0 1.5px var(--line); }

/* ---------- Deals ---------- */
.filter-label { font-size: 13px; font-weight: 600; color: var(--ink-3); margin-bottom: -8px; }
.deal-card { display: grid; gap: 12px; }
.deal-top { display: flex; gap: 12px; align-items: flex-start; }
.deal-body { flex: 1; min-width: 0; }
.deal-body b { font-family: var(--font-display); font-weight: 500; font-size: 17px; line-height: 1.35; display: block; }
.off { font-family: var(--font-display); font-weight: 600; font-size: 17px; background: var(--amber-500); color: var(--ink); border-radius: 12px; padding: 2px 9px; flex: none; }
.price { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
.price .now { font-family: var(--font-display); font-weight: 600; font-size: 24px; color: var(--green-900); line-height: 1.2; }
.price .was { color: var(--ink-3); text-decoration: line-through; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--ink-2); }
.facts span { display: inline-flex; align-items: center; gap: 5px; }
.saved-row { display: flex; align-items: center; gap: 8px; background: var(--green-100); color: var(--green-900); border-radius: 14px; padding: 8px 12px; font-weight: 600; font-size: 15px; }

.map { position: relative; border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--line); background: #EAF1E2; aspect-ratio: 100 / 72; }
.map svg { width: 100%; height: 100%; }
.map-tag { position: absolute; left: 10px; top: 8px; font-size: 12px; color: var(--ink-2); background: rgba(255, 255, 255, .85); border-radius: 8px; padding: 0 8px; }
.pin { position: absolute; transform: translate(-50%, -100%); min-width: 44px; min-height: 44px; display: grid; place-items: end center; padding-bottom: 6px; }
.pin span { background: var(--green-900); color: #fff; font-weight: 700; font-size: 14px; border-radius: 12px 12px 12px 2px; padding: 3px 8px; box-shadow: 0 2px 6px rgba(20, 35, 14, .3); position: relative; }
.pin[aria-pressed="true"] span { background: var(--amber-500); color: var(--ink); }
.pin.is-static span { background: var(--amber-500); color: var(--ink); }
.you { position: absolute; transform: translate(-50%, -50%); width: 18px; height: 18px; border-radius: 50%; background: #1B6FD1; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(27, 111, 209, .22); }
.you-label { position: absolute; transform: translate(-50%, 10px); font-size: 12px; font-weight: 700; color: var(--ink); background: #fff; border-radius: 6px; padding: 0 6px; }
.route { stroke: var(--green-900); stroke-width: 1.6; fill: none; stroke-dasharray: 3 2.4; stroke-linecap: round; animation: dash 1.2s linear infinite; }

/* ---------- Dispose (leans on the BMA web look: white + grey surfaces, deep-green rule) ---------- */
.bma-head h2 { font-size: 22px; font-weight: 600; color: var(--green-900); }
.bma-head { border-bottom: 6px solid var(--green-900); padding-bottom: 10px; }
.bma-head p { color: var(--ink-2); font-size: 15px; margin-top: 4px; }
.proto-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--bma-grey); border-radius: 8px; padding: 2px 10px; margin-top: 10px; }
.stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stepper li { font-size: 13px; font-weight: 600; color: var(--ink-3); display: grid; gap: 6px; line-height: 1.4; }
.stepper li::before { content: ""; height: 6px; border-radius: 99px; background: #D9DFD3; }
.stepper li.is-done::before { background: var(--green-900); }
.stepper li.is-now::before { background: var(--amber-500); }
.stepper li.is-done, .stepper li.is-now { color: var(--ink); }
.dispose-card { display: grid; gap: 14px; }
.dispose-card h3 { font-size: 19px; }
.sort-guide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sort-guide div { background: var(--bma-grey); border-radius: 16px; padding: 12px; font-size: 14px; }
.sort-guide b { display: flex; align-items: center; gap: 6px; font-size: 15px; }
.sort-guide .yes b { color: var(--green-900); }
.sort-guide .no b { color: var(--danger); }
.photo { position: relative; border-radius: 18px; overflow: hidden; background: var(--bma-grey); aspect-ratio: 4 / 3; }
.photo img, .photo svg { width: 100%; height: 100%; object-fit: cover; }
.photo.is-checking::after { content: ""; position: absolute; left: 0; right: 0; height: 36%; top: -36%; background: linear-gradient(to bottom, transparent, rgba(185, 224, 138, .55)); border-bottom: 2px solid #fff; animation: sweep 1.3s linear infinite; }
.status-row { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--green-100); border-top-color: var(--green-900); animation: spin .8s linear infinite; flex: none; }
.alert { background: #FCEBE9; color: #7A1712; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; font-size: 15px; }
.alert b { display: block; }
.presenter-toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); min-height: 44px; cursor: pointer; }
.presenter-toggle input { width: 20px; height: 20px; accent-color: var(--green-900); }

.ticket { background: #fff; border-radius: var(--r-card); border: 1px solid var(--line); overflow: hidden; animation: pop .5s var(--ease); }
.ticket-head { background: var(--green-700); color: #fff; padding: 10px 16px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 17px; }
.ticket-main { padding: 16px; display: flex; gap: 14px; align-items: center; }
.ticket-main .fee { white-space: nowrap; flex: none; font-family: var(--font-display); font-weight: 600; font-size: 54px; line-height: 1.1; color: var(--green-900); }
.ticket-main .fee small { font-size: 18px; font-weight: 500; }
.ticket-main p { font-size: 15px; color: var(--ink-2); }
.ticket-cut { border-top: 2px dashed var(--line); margin: 0 16px; position: relative; }
.ticket-cut::before, .ticket-cut::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--green-50); border: 1px solid var(--line); }
.ticket-cut::before { left: -27px; } .ticket-cut::after { right: -27px; }
.ticket-qr { padding: 16px; display: flex; gap: 14px; align-items: center; }
.ticket-qr svg { width: 104px; height: 104px; flex: none; background: #fff; padding: 6px; border: 1px solid var(--line); border-radius: 10px; }
.code { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-weight: 700; letter-spacing: .06em; font-size: 15px; }

/* ---------- Rewards ---------- */
.level-card { display: grid; gap: 12px; }
.level-top { display: flex; align-items: center; gap: 12px; }
.level-top .tile { background: var(--green-100); }
.level-top h2 { font-size: 21px; }
.balance { margin-left: auto; text-align: right; line-height: 1.25; }
.balance b { font-family: var(--font-display); font-weight: 600; font-size: 28px; color: var(--amber-900); display: block; }
.bar { height: 12px; border-radius: 99px; background: var(--green-100); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--green-500); transition: width .6s var(--ease); }
.level-track { display: grid; grid-template-columns: repeat(5, 1fr); font-size: 12px; text-align: center; color: var(--ink-3); font-weight: 500; }
.level-track li.is-on { color: var(--green-900); font-weight: 700; }
.level-track .emo { display: block; font-size: 20px; filter: grayscale(1); opacity: .55; }
.level-track li.is-on .emo { filter: none; opacity: 1; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric { padding: 14px; display: grid; gap: 2px; }
.metric .ic { color: var(--green-900); }
.metric b { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.25; }
.metric b small { font-size: 16px; font-weight: 500; }
.metric span { font-size: 14px; color: var(--ink-2); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.week li { display: grid; gap: 4px; justify-items: center; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.week .dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--bma-grey); color: #B5B5B5; }
.week .is-done .dot { background: var(--amber-500); color: var(--ink); }
.week .is-today .dot { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--green-900); }
.week .is-today { color: var(--green-900); }
.streak-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.streak-head b { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.2; }
.streak-head .flame { color: var(--amber-500); }
.perk { display: flex; gap: 12px; align-items: center; padding: 12px; }
.perk-body { flex: 1; min-width: 0; }
.perk-body b { font-weight: 600; line-height: 1.35; display: block; }
.perk.is-locked .tile { filter: grayscale(1); opacity: .6; }
.perk-state { flex: none; text-align: right; }
.locked-label { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; color: var(--ink-3); min-height: 44px; }
.log li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
.log li:first-child { border-top: 0; }
.log .pts { margin-left: auto; font-weight: 700; color: var(--amber-900); white-space: nowrap; }
.log .when { font-size: 13px; color: var(--ink-3); }

/* ---------- Overlays (sheets, scan, directions) ---------- */
.overlay { position: absolute; inset: 0; z-index: 30; background: rgba(20, 35, 14, .55); display: flex; flex-direction: column; justify-content: flex-end; animation: fade .2s; }
.sheet { background: #fff; border-radius: 28px 28px 0 0; max-height: 92%; overflow-y: auto; padding: 10px 20px 24px; animation: up .3s var(--ease); outline: none; display: grid; gap: 14px; align-content: start; }
.sheet.is-full { height: 100%; max-height: 100%; border-radius: 0; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; position: sticky; top: -10px; background: #fff; padding: 8px 0 4px; margin-top: -8px; z-index: 2; }
.sheet-head h2 { font-size: 22px; }
.sheet-head .th { display: block; font-size: 15px; color: var(--ink-3); font-weight: 400; }
.close { width: 44px; height: 44px; border-radius: 50%; background: var(--green-50); display: grid; place-items: center; flex: none; }
.field { display: grid; gap: 6px; }
.field label, .field .label { font-weight: 600; font-size: 15px; }
.field input { min-height: 50px; border-radius: 14px; border: 1.5px solid #B9C6AD; padding: 0 14px; background: #fff; width: 100%; }
.field input:focus-visible { outline: 3px solid var(--green-900); outline-offset: 1px; border-radius: 14px; }
.field .hint { font-size: 14px; color: var(--ink-3); }
.field .error { font-size: 14px; color: var(--danger); font-weight: 600; }
.field .error:empty { display: none; }
.field .chips { margin: 0; padding: 2px 0; flex-wrap: wrap; overflow: visible; }

.ing-list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.ing-list li:first-child { border-top: 0; }
.ing-list .mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--green-900); color: #fff; }
.ing-list .is-miss .mark { background: #fff; color: var(--ink-3); box-shadow: inset 0 0 0 1.5px #B5BFAB; }
.ing-list .right { margin-left: auto; }
.steps { counter-reset: s; display: grid; gap: 8px; }
.steps li { counter-increment: s; display: flex; gap: 10px; color: var(--ink-2); font-size: 15px; }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--green-100); color: var(--green-900); font-weight: 700; font-size: 13px; display: grid; place-items: center; flex: none; margin-top: 1px; }
.win { text-align: center; display: grid; gap: 6px; justify-items: center; padding-top: 4px; }
.win .emoji { font-size: 52px; line-height: 1.2; animation: pop .5s var(--ease); }
.win h2 { font-size: 24px; }
.win-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
.win-stats div { background: var(--green-50); border-radius: 16px; padding: 10px 4px; }
.win-stats b { font-family: var(--font-display); font-weight: 600; font-size: 22px; display: block; line-height: 1.3; }
.win-stats span { font-size: 13px; color: var(--ink-2); }
.banner-amber { background: var(--amber-100); color: var(--amber-900); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-weight: 600; }
.banner-amber b { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--ink); }

.scan { position: absolute; inset: 0; z-index: 30; background: #0C1508; color: #fff; display: flex; flex-direction: column; animation: fade .2s; }
.scan-top { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; }
.scan-top .close { background: rgba(255, 255, 255, .14); color: #fff; }
.viewfinder { flex: 1; position: relative; display: grid; place-items: center; overflow: hidden; }
.receipt { width: 190px; background: #FBFBF7; color: #222; border-radius: 4px; padding: 16px 14px 20px; transform: rotate(-4deg); font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 1.7; box-shadow: 0 10px 40px rgba(0, 0, 0, .5); }
.receipt b { display: block; text-align: center; font-size: 12px; }
.receipt .row { display: flex; justify-content: space-between; }
.receipt .barcode { height: 36px; margin-top: 10px; background: repeating-linear-gradient(90deg, #111 0 2px, transparent 2px 4px, #111 4px 5px, transparent 5px 9px, #111 9px 12px, transparent 12px 14px); }
.frame { position: absolute; inset: 12% 14%; border-radius: 22px; pointer-events: none; }
.frame { border: 3px solid #fff;
  --corner: linear-gradient(#000 0 0);
  -webkit-mask: var(--corner) top left / 36px 36px no-repeat, var(--corner) top right / 36px 36px no-repeat, var(--corner) bottom left / 36px 36px no-repeat, var(--corner) bottom right / 36px 36px no-repeat;
          mask: var(--corner) top left / 36px 36px no-repeat, var(--corner) top right / 36px 36px no-repeat, var(--corner) bottom left / 36px 36px no-repeat, var(--corner) bottom right / 36px 36px no-repeat; }
.scanline { position: absolute; left: 16%; right: 16%; height: 3px; border-radius: 3px; background: var(--green-300); box-shadow: 0 0 18px 4px rgba(185, 224, 138, .7); top: 16%; animation: scanline 1.6s ease-in-out infinite alternate; }
.scan-status { padding: 16px 20px 28px; text-align: center; display: grid; gap: 4px; }
.scan-status b { font-family: var(--font-display); font-weight: 500; font-size: 19px; }
.scan-status span { font-size: 14px; color: rgba(255, 255, 255, .8); }
.scan .sheet { position: absolute; left: 0; right: 0; bottom: 0; color: var(--ink); max-height: 78%; }
.found li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.found li:first-child { border-top: 0; }
.found .emoji { font-size: 24px; width: 32px; text-align: center; }
.found .right { margin-left: auto; }

/* ---------- Demo guide ---------- */
.guide { background: var(--ink); color: #fff; padding: 12px 14px; display: grid; gap: 8px; flex: none; animation: up .3s var(--ease); }
.guide:empty { display: none; }
.guide-top { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--green-300); letter-spacing: .04em; text-transform: uppercase; }
.guide-top .done { margin-left: auto; color: var(--ink); background: var(--green-300); border-radius: 99px; padding: 0 8px; text-transform: none; letter-spacing: 0; display: inline-flex; gap: 4px; align-items: center; }
.guide b { font-family: var(--font-display); font-weight: 500; font-size: 17px; line-height: 1.35; }
.guide p { font-size: 14px; color: rgba(255, 255, 255, .9); }
.guide-actions { display: flex; gap: 8px; align-items: center; }
.guide-actions .btn { min-height: 44px; font-size: 15px; padding: 0 16px; border-radius: 14px; }
.guide-actions .g-next { background: var(--amber-500); color: var(--ink); margin-left: auto; }
.guide-actions .g-ghost { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .45); }
.guide-target { outline: 3px solid var(--amber-500) !important; outline-offset: 3px; animation: pulse 1.5s ease-out infinite; }

/* ---------- Feedback: toasts and confetti ---------- */
.toasts { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 50; display: grid; gap: 8px; pointer-events: none; }
.toast { background: var(--ink); color: #fff; border-radius: 16px; padding: 10px 14px; font-size: 15px; box-shadow: 0 8px 24px rgba(20, 35, 14, .3); animation: drop .35s var(--ease); display: flex; gap: 8px; align-items: center; }
.toast b { color: var(--amber-500); white-space: nowrap; }
.toast.is-amber { background: var(--amber-500); color: var(--ink); font-weight: 600; }
.toast.is-amber b { color: var(--ink); }
.toast.out { opacity: 0; transform: translateY(-8px); transition: opacity .3s, transform .3s; }
.fx { position: absolute; inset: 0; z-index: 60; overflow: hidden; pointer-events: none; }
.confetti { position: absolute; top: -14px; width: 9px; height: 14px; border-radius: 2px; animation: fall 1.7s cubic-bezier(.3, .6, .6, 1) forwards; }

/* ---------- Keyframes ---------- */
@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(28px); opacity: 0; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
@keyframes drop { from { transform: translateY(-14px); opacity: 0; } }
@keyframes pop { 0% { transform: scale(.85); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
@keyframes bump { 40% { transform: scale(1.14); } }
@keyframes flash { 0%, 40% { background: var(--amber-100); } }
@keyframes arcdraw { from { stroke-dasharray: 0 300; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes sweep { to { top: 100%; } }
@keyframes scanline { to { top: 82%; } }
@keyframes dash { to { stroke-dashoffset: -5.4; } }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(246, 166, 9, .55); } 100% { box-shadow: 0 0 0 14px rgba(246, 166, 9, 0); } }
@keyframes fall { to { transform: translate(var(--dx), 900px) rotate(var(--rot)); opacity: .85; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- Responsive: full screen on phones, presenter panel on wide screens ---------- */
@media (max-width: 380px) {
  .ring-wrap { width: 100px; height: 100px; }
  .ring-center b { font-size: 28px; }
  .loop-top { gap: 12px; }
  .loop-copy h2 { font-size: 18px; }
  .topbar h1 { font-size: 24px; }
}
@media (max-height: 700px) {
  .ob-art { width: 150px; height: 150px; }
  .ob-art svg { width: 100%; height: 100%; }
  .ob-art .big { font-size: 28px !important; }
  .ob h1 { font-size: 26px; }
  .ob-body { gap: 12px; }
}
@media (max-width: 520px) {
  .stage { padding: 0; }
  .stage::before { display: none; }
  .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
  .app { border-radius: 0; padding-top: env(safe-area-inset-top); }
}
@media (min-width: 980px) {
  .presenter { display: block; }
}
</style>

<body>
<div class="stage">

  <!-- Presenter panel: shown beside the phone on wide screens only -->
  <aside class="presenter" aria-label="Presenter panel">
    <h1><span id="brandMark"></span>FoodLoopBKK</h1>
    <p class="lede">Turn caring about food waste into a daily habit that pays you back.</p>
    <ul class="journey" id="journey"></ul>
    <div class="controls">
      <button class="btn btn-primary btn-sm" data-action="guide-start">Start demo guide</button>
      <button class="btn btn-secondary btn-sm" data-action="reset">Reset demo</button>
    </div>
    <p class="note">With the guide running, <kbd>←</kbd> <kbd>→</kbd> step through it. <br>Prototype for a case-competition pitch. Scanning, photo checks, maps, stores and partners are simulated, and in-app figures are illustrative demo data.</p>
  </aside>

  <div class="phone">
    <div class="app" id="app">
      <main class="screen" id="screen" tabindex="-1"></main>
      <div class="guide" id="guide" role="region" aria-label="Demo guide"></div>
      <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
      <div id="overlay"></div>
      <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
      <div class="fx" id="fx" aria-hidden="true"></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   FoodLoopBKK prototype — script
   1. Data       mock catalogues (foods, recipes, stores, deals, perks)
   2. State      one in-memory object; seedState() is also "Reset demo"
   3. Helpers    dates, formatting, icons, derived values
   4. Rendering  one function per screen and per overlay
   5. Handlers   actions{} dispatched from data-action attributes
   6. Guide      the presenter's step-by-step demo guide
   7. Boot
   Nothing here talks to a network, camera API or storage: every scan,
   photo check and map is simulated with timers and canned data.
   ===================================================================== */

/* ============================== 1. DATA ============================== */

// Ingredient catalogue. `alias` lets manually typed names match recipes.
const FOODS = {
  bread:    { name: 'Sliced bread',   th: 'ขนมปัง',     icon: '🍞', alias: ['bread', 'toast', 'ขนมปัง'] },
  basil:    { name: 'Holy basil',     th: 'กะเพรา',     icon: '🌿', alias: ['basil', 'กะเพรา'] },
  pork:     { name: 'Minced pork',    th: 'หมูสับ',      icon: '🥩', alias: ['pork', 'หมู'] },
  egg:      { name: 'Eggs',           th: 'ไข่ไก่',      icon: '🥚', alias: ['egg', 'ไข่'] },
  rice:     { name: 'Cooked rice',    th: 'ข้าวสวย',     icon: '🍚', alias: ['rice', 'ข้าว'] },
  milk:     { name: 'Fresh milk',     th: 'นมสด',       icon: '🥛', alias: ['milk', 'นม'] },
  tomato:   { name: 'Tomatoes',       th: 'มะเขือเทศ',   icon: '🍅', alias: ['tomato', 'มะเขือเทศ'] },
  yogurt:   { name: 'Yogurt',         th: 'โยเกิร์ต',     icon: '🥣', alias: ['yogurt', 'yoghurt', 'โยเกิร์ต'] },
  garlic:   { name: 'Garlic',         th: 'กระเทียม',    icon: '🧄', alias: ['garlic', 'กระเทียม'] },
  banana:   { name: 'Bananas',        th: 'กล้วย',       icon: '🍌', alias: ['banana', 'กล้วย'] },
  chicken:  { name: 'Chicken breast', th: 'อกไก่',       icon: '🍗', alias: ['chicken', 'ไก่'] },
  glory:    { name: 'Morning glory',  th: 'ผักบุ้ง',      icon: '🥬', alias: ['morning glory', 'ผักบุ้ง'] },
  tofu:     { name: 'Soft tofu',      th: 'เต้าหู้',      icon: '🍢', alias: ['tofu', 'เต้าหู้'] },
  coconut:  { name: 'Coconut milk',   th: 'กะทิ',        icon: '🥥', alias: ['coconut', 'กะทิ'] },
  mushroom: { name: 'Mushrooms',      th: 'เห็ด',        icon: '🍄', alias: ['mushroom', 'เห็ด'] },
  lime:     { name: 'Limes',          th: 'มะนาว',      icon: '🍋', alias: ['lime', 'มะนาว'] },
  galangal: { name: 'Galangal',       th: 'ข่า',         icon: '🌿', alias: ['galangal', 'ข่า'] },
  chili:    { name: 'Chilies',        th: 'พริก',        icon: '🌶️', alias: ['chili', 'chilli', 'พริก'] },
};
// Icon guesses for manual entries that are not in the catalogue.
const ICON_GUESS = [['kimchi', '🥬'], ['apple', '🍎'], ['mango', '🥭'], ['fish', '🐟'], ['shrimp', '🦐'], ['cheese', '🧀'],
  ['carrot', '🥕'], ['noodle', '🍜'], ['curry', '🍛'], ['orange', '🍊'], ['butter', '🧈'], ['salad', '🥗'], ['cake', '🍰']];

// Seed fridge: [key, quantity, days until expiry, price THB, weight kg]. Prices and weights are illustrative.
const SEED_FRIDGE = [
  ['yogurt', '1 cup', -1, 25, 0.15],
  ['basil', '1 bunch', 0, 15, 0.05],
  ['bread', '6 slices', 1, 45, 0.4],
  ['rice', '2 cups', 1, 15, 0.3],
  ['milk', '500 ml', 2, 52, 0.5],
  ['banana', '3 pcs', 2, 25, 0.35],
  ['pork', '300 g', 3, 60, 0.3],
  ['tomato', '4 pcs', 4, 30, 0.4],
  ['egg', '6 pcs', 9, 48, 0.36],
  ['garlic', '1 head', 14, 20, 0.1],
];

// The mock receipt that "Scan receipt" reads.
const RECEIPT = {
  store: 'Talad Jai Dee Mart',
  items: [
    ['glory', '1 bunch', 2, 20, 0.25],
    ['chicken', '400 g', 3, 89, 0.4],
    ['mushroom', '200 g', 3, 45, 0.2],
    ['tofu', '1 block', 4, 18, 0.3],
    ['lime', '5 pcs', 10, 25, 0.25],
    ['coconut', '250 ml', 30, 32, 0.25],

// --- Dates (date-only, local time)
const DAY_MS = 86400000;
function today() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function addDays(n) { const d = today(); d.setDate(d.getDate() + n); return d; }
function iso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function fromIso(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
const daysLeft = item => Math.round((fromIso(item.expires) - today()) / DAY_MS);

// Freshness state and countdown label for a days-left value.
function freshness(d) {
  if (d < 0)  return { state: 'expired', group: 'Expired',       label: `Expired ${plural(-d, 'day')} ago` };
  if (d === 0) return { state: 'today',  group: 'Expires today', label: 'Expires today' };
  if (d <= NEAR_DAYS) return { state: 'soon', group: 'Use soon', label: `${plural(d, 'day')} left` };
  return { state: 'fresh', group: 'Fresh', label: `${plural(d, 'day')} left` };
}
const isNear = d => d >= 0 && d <= NEAR_DAYS;
const pillFor = d => { const f = freshness(d); return `<span class="pill pill-${f.state}">${icon(f.state === 'fresh' ? 'leaf' : 'clock', 14)}${f.label}</span>`; };

// --- Fridge and recipe derivations
const sortedFridge = () => [...state.fridge].sort((a, b) => daysLeft(a) - daysLeft(b));
function guessFood(name) {
  const n = name.toLowerCase();
  const key = Object.keys(FOODS).find(k => FOODS[k].alias.some(a => n.includes(a)));
  if (key) return { key, icon: FOODS[key].icon, th: FOODS[key].th };
  const hit = ICON_GUESS.find(([word]) => n.includes(word));
  return { key: null, icon: hit ? hit[1] : '🥡', th: '' };
}
// For one recipe: which ingredients are in the fridge (not expired), which are missing, how many expire soon.
function recipeInfo(r) {
  const have = {};
  sortedFridge().forEach(it => { if (it.key && daysLeft(it) >= 0 && !have[it.key]) have[it.key] = it; });
  const ings = r.ings.map(g => {
    const item = have[g.key] || null;
    const d = item ? daysLeft(item) : null;
    return { ...g, food: FOODS[g.key], item, d, near: item ? isNear(d) : false };
  });
  const near = ings.filter(g => g.near);
  return {
    ings, near,
    have: ings.filter(g => g.item),
    missing: ings.filter(g => !g.item),
    soonest: Math.min(99, ...ings.filter(g => g.item).map(g => g.d)),
  };
}
// Recipes that use near-expiry items come first, then the ones closest to expiry, then fewest missing.
function rankedRecipes() {
  return RECIPES.map(r => ({ r, info: recipeInfo(r) }))
    .sort((a, b) => b.info.near.length - a.info.near.length || a.info.soonest - b.info.soonest || a.info.missing.length - b.info.missing.length);
}
const bestRecipeFor = key => (rankedRecipes().find(x => x.info.have.some(g => g.key === key)) || {}).r;

// Today's mission: cook with the seeded target while it is still in the fridge, else the next expiring item.
function missionTarget() {
  const usable = sortedFridge().filter(it => it.key && isNear(daysLeft(it)) && bestRecipeFor(it.key));
  return usable.find(it => it.key === state.mission.key) || usable[0] || null;
}

}

// A decorative, non-scannable QR-style pattern for the demo voucher.
function fakeQr() {
  const n = 21; let seed = 20;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const finder = (x, y, ox, oy) => { const a = x - ox, b = y - oy; if (a < 0 || b < 0 || a > 6 || b > 6) return null; return a === 0 || b === 0 || a === 6 || b === 6 || (a > 1 && a < 5 && b > 1 && b < 5); };
  let cells = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const f = [finder(x, y, 0, 0), finder(x, y, 14, 0), finder(x, y, 0, 14)].find(v => v !== null);
    const nearFinder = (x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12);
    const dark = f !== undefined ? f : (!nearFinder && rnd() > 0.5);
    if (dark) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="0 0 ${n} ${n}" role="img" aria-label="Demo QR code, not scannable" fill="#14230E" shape-rendering="crispEdges">${cells}</svg>`;
}

function confetti() {

  const colors = ['#F6A609', '#4BA254', '#B9E08A', '#2A6419', '#FFEFC9'];
  const fx = $('#fx');
  for (let i = 0; i < 40; i++) {

    fx.append(p);
    later(() => p.remove(), 2300);

}

// Every qualifying action goes through award(): points, totals, streak, loop arcs, level-ups, celebration.
function award({ pts, text, icon: emoji, money = 0, kg = 0, items = 0, loop = null }) {
  const levelBefore = levelIndex(state.xp);
  const msgs = [[`<b>+${pts} pts</b> ${esc(text)}`, false]];
  let party = false;

  state.xp += pts; state.points += pts;
  state.stats.money += money;
  state.stats.kg = Math.round((state.stats.kg + kg) * 10) / 10;
  state.stats.items += items;
  state.log.unshift({ icon: emoji, text, pts, when: 'Just now' });

  if (!state.todayDone) {                       // first action today extends the streak
    state.todayDone = true; state.streak += 1;
    const milestone = STREAK_MILESTONES.includes(state.streak);
    msgs.push([`🔥 ${state.streak}-day streak${milestone ? '. Milestone reached!' : ' and counting'}`, milestone]);
    party = party || milestone;
  }
  if (loop && !state.loop[loop]) {              // close one arc of today's loop
    state.loop[loop] = true; state.freshArcs.push(loop);
    if (LOOP.every(l => state.loop[l.key]) && !state.loopBonus) {
      state.loopBonus = true; state.xp += POINTS.loopBonus; state.points += POINTS.loopBonus;
      state.log.unshift({ icon: '🔄', text: "Closed today's loop", pts: POINTS.loopBonus, when: 'Just now' });
      msgs.push([`Loop closed today. +${POINTS.loopBonus} bonus pts`, true]);
      party = true;
    }
  }
  const levelAfter = levelIndex(state.xp);
  const levelUp = levelAfter > levelBefore ? LEVELS[levelAfter] : null;
  if (levelUp) { msgs.push([`${levelUp.icon} Level up: you're now a ${levelUp.name}`, true]); party = true; }

  msgs.forEach(([m, amber], i) => later(() => toast(m, amber), i * 550));
  if (party) confetti();
  return { levelUp };
}

function go(tab) {
  state.tab = tab;
  $('#screen').scrollTop = 0;
}
function closeOverlay() { state.overlay = null; render(); }

const actions = {
  // --- Onboarding
  'ob-next'() { if (state.obStep < 2) state.obStep++; else state.screen = 'app'; $('#screen').scrollTop = 0; render(); },
  'ob-back'() { state.obStep = Math.max(0, state.obStep - 1); render(); },
  'ob-skip'() { state.screen = 'app'; render(); },

  // --- Navigation
  'tab'(d) { state.overlay = null; go(d.tab); render(); },
  'close-overlay': closeOverlay,
  'fridge-view'(d) { if (state.tab !== 'fridge') go('fridge'); state.fridgeView = d.view; render(); },

  // --- Fridge: simulated receipt scan
  'open-scan'() {
    state.overlay = { type: 'scan', phase: 'scanning' };
    render();
    later(() => { if (state.overlay && state.overlay.type === 'scan') { state.overlay.phase = 'found'; render(); } }, 2400);
  },
  'scan-confirm'() {
    RECEIPT.items.forEach(row => state.fridge.push(makeItem(row, { isNew: true })));
    state.scanned = true; state.overlay = null; state.fridgeView = 'items';
    award({ pts: POINTS.scan, text: `Logged ${RECEIPT.items.length} items from a receipt`, icon: '🧾', loop: 'eat' });
    guideSignal('scan');
    render();
  },

  // --- Fridge: manual entry
  'open-add'() { state.overlay = { type: 'add' }; render(); const n = $('#fName'); if (n) n.focus(); },
  'date-chip'(d, el) {
    $('#fDate').value = iso(addDays(Number(d.days)));
    el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === el));
  },
  'add-item'(form) {
    const name = form.name.value.trim(), qty = form.qty.value.trim() || '1', date = form.date.value;
    $('#fNameErr').textContent = name ? '' : 'Enter an item name.';
    $('#fDateErr').textContent = date ? '' : 'Choose an expiry date.';
    if (!name) { form.name.focus(); return; }
    if (!date) { form.date.focus(); return; }
    const g = guessFood(name);
    state.fridge.push({ id: 'i' + (++uid), key: g.key, name, th: '', icon: g.icon, qty, expires: date, price: 30, kg: 0.2, isNew: true });
    state.overlay = null; state.fridgeView = 'items';
    award({ pts: POINTS.log, text: `Logged ${name}`, icon: g.icon, loop: 'eat' });
    render();
  },

  // --- Fridge: item actions
  'use-item'(d) {
    const it = state.fridge.find(x => x.id === d.id); if (!it) return;
    const rescued = isNear(daysLeft(it));
    state.fridge = state.fridge.filter(x => x !== it);
    award(rescued
      ? { pts: POINTS.use, text: `Used ${it.name.toLowerCase()} in time`, icon: it.icon, money: it.price, kg: it.kg, items: 1, loop: 'eat' }
      : { pts: POINTS.log, text: `Used ${it.name.toLowerCase()}`, icon: it.icon, loop: 'eat' });
    render();
  },
  'bin-item'(d) {
    const it = state.fridge.find(x => x.id === d.id); if (!it) return;
    state.fridge = state.fridge.filter(x => x !== it);
    go('dispose'); render();
    toast(`${esc(it.name)} removed. Sort it as organic waste to claim your fee.`);
  },

  // --- Recipes
  'open-recipe'(d) { state.overlay = { type: 'recipe', id: d.id }; render(); },
  'cook'(d) {
    const r = RECIPES.find(x => x.id === d.id), info = recipeInfo(r);
    const target = missionTarget();
    const used = info.have.filter(g => !g.keep);                 // staples marked keep stay in the fridge
    const rescued = used.filter(g => g.near).map(g => g.item);   // near-expiry items count as rescued
    const usedIds = new Set(used.map(g => g.item.id));
    state.fridge = state.fridge.filter(it => !usedIds.has(it.id));
    const missionHit = !state.mission.done && target && info.have.some(g => g.item.id === target.id);
    if (missionHit) state.mission.done = true;
    const pts = POINTS.cook + POINTS.perRescue * rescued.length + (missionHit ? POINTS.mission : 0);
    const money = rescued.reduce((s, it) => s + it.price, 0);
    const res = award({ pts, text: `Cooked ${r.name}`, icon: r.icon, money, kg: rescued.reduce((s, it) => s + it.kg, 0), items: rescued.length, loop: 'eat' });
    state.overlay = { type: 'cooked', name: r.name, icon: r.icon, rescued: rescued.map(it => it.name), money, pts, mission: missionHit, levelUp: res.levelUp };
    guideSignal('cook');
    render();
  },

  // --- Deals
  'deals-view'(d) { state.dealsView = d.view; render(); },
  'filter-cat'(d) { state.filters.cat = d.cat; render(); },
  'filter-dist'(d) { state.filters.dist = Number(d.dist); render(); },
  'filter-ending'() { state.filters.endingSoon = !state.filters.endingSoon; render(); },
  'clear-filters'() { state.filters = { cat: 'all', dist: 0, endingSoon: false }; render(); },
  'map-pin'(d) { state.mapStore = d.store; render(); },
  'navigate'(d) {
    const deal = state.deals.find(x => x.id === d.id), first = !deal.navigated;
    if (first) {                                // the saving counts once, on the first tap
      deal.navigated = true; deal.left = Math.max(0, deal.left - 1);
      award({ pts: POINTS.deal, text: `Rescued ${deal.name}`, icon: deal.icon, money: deal.was - deal.now, kg: deal.kg, items: 1, loop: 'save' });
      guideSignal('deal');
    }
    state.overlay = { type: 'directions', id: deal.id, first };
    render();
  },

  // --- Dispose
  'sample-photo'() { setPhoto('sample'); },
  'retake'() { setPhoto(null); },
  'verify'() {
    state.dispose.status = 'checking'; render();
    later(() => {
      if (state.dispose.status !== 'checking') return;
      if (state.dispose.forceFail) { state.dispose.forceFail = false; state.dispose.status = 'rejected'; render(); return; }
      state.dispose.status = 'success';
      award({ pts: POINTS.dispose, text: 'Sorted organic waste, photo verified', icon: '🗑️', loop: 'sort' });
      guideSignal('dispose');
      confetti();
      render();
    }, 2200);
  },

  // --- Rewards
  'open-perk'(d) { state.overlay = { type: 'perk', id: d.id }; render(); },
  'redeem'(d) {
    const p = PERKS.find(x => x.id === d.id);
    if (state.redeemed[p.id] || state.points < p.cost) return;
    state.points -= p.cost;
    state.redeemed[p.id] = 'LOOP-' + p.id.toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase();
    confetti(); toast(`Redeemed: ${p.name}`, true);
    render();
  },

  // --- Demo tools
  'open-demo'() { state.overlay = { type: 'demo' }; render(); },
  'replay-intro'() { state.overlay = null; state.guide.active = false; state.screen = 'onboarding'; state.obStep = 0; $('#screen').scrollTop = 0; render(); },
  'reset': resetDemo,
  'guide-start'() { state.screen = 'app'; state.guide = { active: true, step: 0, done: {}, scroll: true }; guideGo(0); },
  'guide-next'() { if (state.guide.step < GUIDE.length - 1) guideGo(state.guide.step + 1); else actions['guide-exit'](); },
  'guide-back'() { if (state.guide.step > 0) guideGo(state.guide.step - 1); },
  'guide-exit'() { state.guide.active = false; render(); },
};

function setPhoto(src) {
  const d = state.dispose;
  if (d.photo && d.photo !== 'sample') URL.revokeObjectURL(d.photo);
  d.photo = src; d.status = src ? 'photo' : 'idle';
  render();
}

// Change events: the photo input and the presenter's "fail next check" switch.
const changes = {
  'photo'(el) { const file = el.files && el.files[0]; if (file) setPhoto(URL.createObjectURL(file)); },
  'force-fail'(el) { state.dispose.forceFail = el.checked; },
};

function resetDemo() {
  timers.forEach(clearTimeout); timers = [];
  if (state && state.dispose.photo && state.dispose.photo !== 'sample') URL.revokeObjectURL(state.dispose.photo);
  $('#toasts').innerHTML = ''; $('#fx').innerHTML = '';
  uid = 0; lastPoints = null; lastOverlayKey = null;
  state = seedState();
  $('#screen').scrollTop = 0;
  render();
}

// --- Event wiring: one delegated listener per event type
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('overlay')) { closeOverlay(); return; }   // tap on the backdrop
  const el = e.target.closest('[data-action]');
  if (el && !el.disabled && actions[el.dataset.action]) actions[el.dataset.action](el.dataset, el);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el) changes[el.dataset.change](el);
  else if (e.target.id === 'fDate') document.querySelectorAll('[data-action="date-chip"]').forEach(c => c.setAttribute('aria-pressed', 'false'));
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-submit]');
  if (form) { e.preventDefault(); actions[form.dataset.submit](form); }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (e.key === 'Escape' && state.overlay) closeOverlay();
  else if (state.guide.active && !typing && e.key === 'ArrowRight') actions['guide-next']();
  else if (state.guide.active && !typing && e.key === 'ArrowLeft') actions['guide-back']();
});

/* ============================== 6. DEMO GUIDE ======================== */

// Each step opens a tab, highlights one control and, where `on` is set, ticks itself when that action happens.
const GUIDE = [
  { tab: 'home', target: '.loop-card', title: 'One loop, three small actions',
    text: "Use your fridge, rescue a deal, sort your scraps. Any one keeps the streak; all three close the loop." },
  { tab: 'fridge', view: 'items', target: '[data-action="open-scan"]', on: 'scan', title: 'Before you eat: scan a receipt',
    text: 'Tap Scan receipt, then add the items. The fridge sorts itself by what expires first.' },
  { tab: 'fridge', view: 'recipes', target: '.recipe-card', on: 'cook', title: 'Cook what expires first',
    text: 'Recipes using near-expiry food come first. Open the top one and tap Cooked this.' },
  { tab: 'deals', target: '.btn-nav', on: 'deal', title: 'Before you waste: rescue a deal',
    text: 'Surplus food at 40–60% off, pickup only. Tap Navigate to store to see the saving.' },
  { tab: 'dispose', target: '.dispose-cta', on: 'dispose', title: 'When you dispose: ไม่เทรวม',
    text: 'Use a sample photo and verify it to unlock the ฿20 collection fee. Tick the presenter box first to show a rejected photo.' },
  { tab: 'rewards', target: '.metrics', title: 'Every action counted',
    text: 'Money, food and CO₂e totals, the streak, level and perks all moved with what you just did.' },
];

function guideGo(i) {
  const s = GUIDE[i];
  state.guide.step = i; state.guide.scroll = true;
  state.overlay = null;
  go(s.tab);
  if (s.view) state.fridgeView = s.view;
  if (s.tab === 'deals') { state.dealsView = 'list'; state.filters = { cat: 'all', dist: 0, endingSoon: false }; }
  render();
}
function guideSignal(evt) { if (state.guide.active) state.guide.done[evt] = true; }

function renderGuide() {
  const g = state.guide, host = $('#guide');
  if (!g.active || state.screen !== 'app') { host.innerHTML = ''; return; }
  const s = GUIDE[g.step], last = g.step === GUIDE.length - 1, done = s.on && g.done[s.on];
  host.innerHTML = `
    <div class="guide-top">Demo guide · ${g.step + 1} of ${GUIDE.length}${done ? `<span class="done">${icon('check', 14)}Done</span>` : ''}</div>
    <b>${s.title}</b><p>${s.text}</p>
    <div class="guide-actions">
      <button class="btn g-ghost" data-action="guide-exit">Exit</button>
      ${g.step ? '<button class="btn g-ghost" data-action="guide-back">Back</button>' : ''}
      <button class="btn g-next" data-action="guide-next">${last ? 'Finish' : 'Next'}${icon('chev', 16)}</button>
    </div>`;
  const target = state.tab === s.tab && !state.overlay ? $('#screen').querySelector(s.target) : null;
  if (target) {
    target.classList.add('guide-target');
    const box = target.getBoundingClientRect(), view = $('#screen').getBoundingClientRect();
    if (g.scroll || box.top < view.top || box.bottom > view.bottom) target.scrollIntoView({ block: 'center' });
    g.scroll = false;
  }
}

/* ============================== 7. BOOT ============================== */

$('#brandMark').innerHTML = ringSvg({ eat: true, save: true, sort: true }, { size: 44, light: true });
$('#journey').innerHTML = LOOP.map(l => `<li><span class="tile">${icon(l.icon)}</span><div><b>${l.phase}</b><span>${l.blurb}</span></div></li>`).join('');
resetDemo();
</script>
</body>
